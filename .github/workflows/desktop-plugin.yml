name: Desktop plugin

on:
  push:
    paths:
      - 'desktop-plugin/**'
      - 'app/src/main/cpp/**'
      - '.github/workflows/desktop-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S desktop-plugin -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: build/Release/dronesynth_tests.exe

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: build/dronesynth_tests

      - uses: actions/upload-artifact@v4
        with:
          name: DroneSynth-${{ runner.os }}
          path: build/bin/

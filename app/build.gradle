plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.sufystudios.synthguide'
    compileSdk 37
    defaultConfig {
        applicationId "xyz.sufystudios.synthguide"
        minSdk 23
        // Kept at 32: raising it opts into newer platform behaviour (e.g. enforced edge-to-edge).
        targetSdk 32
        versionCode  230003
        versionName "1.23.03"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // Oboe is consumed as a prefab shared library, which requires the shared STL.
                arguments '-DANDROID_STL=c++_shared'
                // armeabi and mips are deprecated in NDK r16 so we don't want to build for them
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }
    androidResources {
        localeFilters += ['en']
    }
    buildFeatures {
        prefab true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'com.anjlab.android.iab.v3:library:2.0.3'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'com.suddenh4x.ratingdialog:awesome-app-rating:2.4.0'
    implementation 'com.google.oboe:oboe:1.11.0'
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing comes from keystore.properties (git-ignored; see keystore.properties.example).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

android {
    namespace 'xyz.sufystudios.synthguide'
    compileSdk 37
    defaultConfig {
        applicationId "xyz.sufystudios.synthguide"
        minSdk 23
        targetSdk 36
        versionCode 310100
        versionName "3.1.1"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // Oboe is consumed as a prefab shared library, which requires the shared STL.
                arguments '-DANDROID_STL=c++_shared'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }
    androidResources {
        localeFilters += ['en']
    }
    buildFeatures {
        prefab true
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            upload {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Installs alongside the Play version, which can't be replaced by a locally signed build.
            applicationIdSuffix ".dev"
        }
        release {
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.upload
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.core:core-ktx:1.19.1'

    implementation 'com.android.billingclient:billing-ktx:9.1.0'
    // Billing's Play services pull in Fragment 1.1, whose activity-result handling is broken.
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'com.google.oboe:oboe:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    // The real org.json, for unit tests of the preset file format (android.jar only has stubs).
    testImplementation 'org.json:json:20250517'
}
